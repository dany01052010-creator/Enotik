name: Build Enotik-zamen-mod APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/EnotikZamenMod/**'
      - '.github/workflows/enotik-zamen-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/EnotikZamenMod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/Enotik-zamen-mod.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Enotik-zamen-mod-apk
          path: out/Enotik-zamen-mod.apk
