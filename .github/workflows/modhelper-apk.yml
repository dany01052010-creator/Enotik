name: Build ModHelper APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/modhelper-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses and install SDK 34
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 5 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E '^e: |error:|What went wrong|Execution failed|Could not|Unresolved' -A2 build.log | head -70 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle failed::$msg"
            exit $code
          fi
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk ModHelper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ModHelper-apk
          path: android/ModHelper.apk
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete modhelper-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create modhelper-latest ModHelper.apk --prerelease --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ModHelper APK (последняя сборка)" --notes "Скачай файл ModHelper.apk и установи на телефон."
