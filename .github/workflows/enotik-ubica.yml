name: Build Enotik-ubica APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/EnotikRoundWorld/**'
      - '.github/workflows/enotik-ubica.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/EnotikRoundWorld
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Make game offline (bundle three.js)
        run: bash prebuild.sh
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/Enotik-ubica.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Enotik-ubica-apk
          path: out/Enotik-ubica.apk
