plugins {
    id 'com.android.application'
}

android {
    namespace 'com.enotik.zamenmod'
    compileSdk 34

    defaultConfig {
        applicationId 'com.enotik.zamenmod'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
